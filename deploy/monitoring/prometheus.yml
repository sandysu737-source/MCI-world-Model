# MCI World Model — Prometheus 抓取配置
#
# 在 Prometheus 部署中 include 此配置

scrape_configs:
  - job_name: "mci-world-model"
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets:
          # 替换为实际 Service IP 或使用 K8s 服务发现
          - "mci-world-model:80"
