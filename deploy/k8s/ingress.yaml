apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mci-world-model
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts:
        - mci.example.com
      secretName: mci-tls
  rules:
    - host: mci.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mci-world-model
                port:
                  number: 80
