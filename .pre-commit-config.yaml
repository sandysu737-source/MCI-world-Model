# MCI World Model v3.3.1 — Pre-commit 配置
# 安装: pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        pass_filenames: true
        args: [--strict, --ignore-missing-imports]
        files: ^src/

      - id: ai-guard
        name: ai-guard (AI 工程化守卫)
        entry: bash scripts/ai-verify/ai-guard.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
