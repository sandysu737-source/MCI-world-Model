[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mci-world-model"
version = "4.6.1"
description = "MCI World Model — 因果世界模型引擎 (LeCun 六模块完整闭环: Perception+WorldModel+Configurator+Cost+Actor+STM)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "MCI World Model Team", email = "team@mci-world-model.ai" },
]
keywords = [
    "causal-inference", "world-model", "pearl", "do-calculus",
    "jepa", "energy-center", "counterfactual",
    "bayesian-network", "spectral-causal", "causal-discovery",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
# JEPA 训练与可视化
jepa = [
    "torch>=2.0.0",
    "torch-geometric>=2.4.0",
]
# su-memory 能量核心 (EnergyCore/TemporalCore/EnergyBus)
# 通过 PYTHONPATH 引用同仓库源码: export PYTHONPATH="../su-memory-sdk/src:$PYTHONPATH"
memory = [
    "su-memory>=3.5.0",
]
# 向量嵌入存储 (Zvec, 阿里开源)
zvec = [
    "zvec>=0.5.0",
]
# MLX 小模型训练加速 (Apple Silicon)
mlx_model = [
    "mlx>=0.5.0",
]
# 完整小模型 + 向量存储
small_model = [
    "zvec>=0.5.0",
    "mlx>=0.5.0",
]
# SIGReg 基准
bench = [
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
]
# 完整安装：pip install mci-world-model[full]
full = [
    "torch>=2.0.0",
    "torch-geometric>=2.4.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "networkx>=3.0",
    "zvec>=0.5.0",
    "mlx>=0.5.0",
]
# 开发者工具
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "black>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/sandysu737-source/mci-world-model"
Repository = "https://github.com/sandysu737-source/mci-world-model"
Issues = "https://github.com/sandysu737-source/mci-world-model/issues"
Discussions = "https://github.com/sandysu737-source/mci-world-model/discussions"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mci_world_model" = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PL",  # pylint
    "RUF", # ruff-specific
]
ignore = [
    "PLR0913",  # too many arguments
    "PLR2004",  # magic value
    "RUF001",   # ambiguous-unicode-character-string (Chinese intentional)
    "RUF002",   # ambiguous-unicode-character-docstring (Chinese intentional)
    "RUF003",   # ambiguous-unicode-character-comment (Chinese intentional)
    "PLC0415",  # import-outside-top-level (conditional/lazy imports intentional)
    "E402",     # module-import-not-at-top-of-file (sys.path manipulation intentional)
    "RUF012",   # mutable-class-default (known design patterns)
    "N806",     # non-lowercase-variable-in-function (domain-specific names)
    "N803",     # invalid-argument-name (domain-specific names)
    "PLR0912",  # too-many-branches (complex algorithms intentional)
    "PLR0915",  # too-many-statements (complex algorithms intentional)
    "RUF013",   # implicit-optional (style choice)
    "PLR0911",  # too-many-return-statements
    "PLW0603",  # global-statement (intentional in modules)
    "B905",     # zip-without-explicit-strict (known usage patterns)
    "N815",     # mixed-case-variable-in-class-scope
    "N817",     # camelcase-imported-as-acronym
    "E501",     # line-too-long (Chinese docstrings intentional)
    "RUF022",   # unsorted-__all__ (logical grouping > alphabetical)
    "SIM102",   # collapsible-if (nested if with Chinese logic intentional)
    "SIM105",   # suppressible-exception (known patterns)
    "SIM108",   # if-else-block-instead-of-ternary (readability)
    "SIM110",   # reimplemented-builtin (known patterns)
    "B007",     # unused-loop-variable (iterative algorithms)
    "C416",     # unnecessary-comprehension (compatibility)
    "PLW2901",  # redefined-loop-name (intentional reuse)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]
"benchmarks/*" = ["PLR2004", "T201"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_return_any = false

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
# PYTHONPATH 包含 su-memory-sdk 源码（同 monorepo）
pythonpath = ["../su-memory-sdk/src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests requiring torch",
    "unit: fast unit tests (<100ms each)",
    "functional: functional/integration tests",
    "benchmark: performance benchmark tests",
]

[tool.pytest-benchmark]
min_rounds = 5
max_time = 2.0
timer = "perf_counter"
# 回归门禁: CI 中自动对比 baseline 并报告 >50% 劣化
# 保存: pytest benchmarks/ -m benchmark --benchmark-save=baseline
# 对比: pytest benchmarks/ -m benchmark --benchmark-compare
# 失败: pytest benchmarks/ -m benchmark --benchmark-compare --benchmark-compare-fail=min:50%
# 跳过: BENCHMARK_SKIP=true pytest benchmarks/ -m benchmark
compare = ["baseline"]
compare_fail = ["min:50%"]

[tool.coverage.run]
source = ["mci_world_model"]
relative_files = true

[tool.coverage.report]
fail_under = 53
show_missing = true
skip_covered = false
