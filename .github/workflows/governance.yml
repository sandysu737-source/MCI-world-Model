# Governance CI —— 服务端不可绕过的执行点（本地 hook 可绕过，CI 是最终防线）
# 触发: PR 到 main/master + push 到 main/master
# 职责:
#   1. 跑 governance 全量门禁（risk-classify + quality-gate）
#   2. L2 代码: 只校验 PR approved-reviews-count >= 2
#   3. 失败则阻断合并（配合分支保护规则 status check 必过）
#
# 启用: 复制本文件到 .github/workflows/governance.yml
# 前置: 仓库 Secrets 设置 GOV_REVIEW_SECRET(团队密钥, 用于 token 校验)
# 分支保护: Settings → Branches → 勾选 "Require status checks to pass" → 选 "governance"
name: governance
on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装工具链
        run: pip install radon bandit ruff pytest pytest-cov
      - name: governance 对抗回归（F-1/F-3/F-10/F-14）
        run: bash scripts/ai-verify/tests/test-anti-evasion.sh
      - name: 跑 risk-classify（风险定级）
        id: classify
        run: |
          # 对 PR 的改动文件定级
          FILES_FILE=changed-files.txt
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD > "$FILES_FILE"
          else
            git diff --name-only --diff-filter=ACMR HEAD~1 HEAD > "$FILES_FILE" 2>/dev/null || : > "$FILES_FILE"
          fi
          printf 'files=%s\n' "$(cat "$FILES_FILE")" >> "$GITHUB_OUTPUT"
          if [ -s "$FILES_FILE" ]; then
            mapfile -t FILES < "$FILES_FILE"
            bash scripts/ai-verify/risk-classify.sh "${FILES[@]}" > classify.txt 2>&1 || true
          else
            bash scripts/ai-verify/risk-classify.sh > classify.txt 2>&1 || true
          fi
          cat classify.txt
          MAXL=$(grep '^MAX_LEVEL' classify.txt | tail -1 | grep -oE 'L[012]$')
          echo "max_level=${MAXL:-L2}" >> $GITHUB_OUTPUT
      - name: 跑 quality-gate（全量门禁）
        env:
          RADON_BIN: radon
          RUFF_BIN: ruff
          BANDIT_BIN: bandit
          PYTEST_BIN: pytest
          PYTEST_SCOPE: full
          COVERAGE_HARD_GATE: '1'   # CI 侧覆盖率硬阻断
        run: |
          if [ -s changed-files.txt ]; then
            mapfile -t FILES < changed-files.txt
            bash scripts/ai-verify/quality-gate.sh "${{ steps.classify.outputs.max_level }}" "${FILES[@]}"
          else
            bash scripts/ai-verify/quality-gate.sh "${{ steps.classify.outputs.max_level }}"
          fi
      - name: hook 完整性校验（F-7/P1-G）
        run: bash scripts/ai-verify/hook-integrity.sh
      - name: 远端审计留痕（F-19/P2-F）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            classify.txt
            changed-files.txt
            .ai-governance/reports/
          if-no-files-found: warn
      - name: L2 双人 approve 校验
        if: steps.classify.outputs.max_level == 'L2'
        env:
          GOV_REVIEW_SECRET: ${{ secrets.GOV_REVIEW_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APPROVED=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # 读 PR 的 approved-reviews-count
            APPROVED=$(gh pr view ${{ github.event.pull_request.number }} \
              --json reviewDecision,reviews -q '[.reviews[] | select(.state=="APPROVED" and ((.author.typename // .author.__typename // "") != "Bot")) | .author.login] | unique | length' 2>/dev/null || echo 0)
            echo "PR approved count: $APPROVED"
          fi
          # F-2(P0-E): 已删除 review-token 短路——本地 token 只作本地放行凭证,
          # CI 一律以 PR approved-reviews-count>=2 为准, 防单人持钥绕过双人评审。
          if [ "$APPROVED" -ge 2 ]; then
            echo "✅ L2: PR 双人 approve ($APPROVED≥2)"
            exit 0
          fi
          echo "🛑 L2 高风险代码: 需 PR approved-reviews-count≥2"
          echo "   当前 approved=$APPROVED (本地签发的 AI_REVIEW_TOKEN 不被 CI 认可)"
          exit 1
