# Governance CI —— 服务端不可绕过的执行点（本地 hook 可绕过，CI 是最终防线）
# 触发: PR 到 main/master + push 到 main/master
# 职责:
#   1. 跑 governance 全量门禁（risk-classify + quality-gate）
#   2. L2 代码: 校验 PR approved-reviews-count；单人模式用所有者当日显式批准指纹
#      （OWNER-APPROVED:PR<PR号>:<Asia/Shanghai YYYY-MM-DD>，绑定当前 PR 与当日，不可跨 PR/跨日重放）
#   3. 失败则阻断合并（配合分支保护规则 status check 必过）
#
# 启用: 复制本文件到 .github/workflows/governance.yml
# 前置: 仓库 Secrets 设置 GOV_REVIEW_SECRET(团队密钥, 用于 token 校验)
# 分支保护: Settings → Branches → 勾选 "Require status checks to pass" → 选 "governance"
name: governance
on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # 单人项目显式授权模式；多人协作时必须上调为 2。
      GOV_MIN_APPROVALS: '1'
      # F-24(治理 K): 单人模式审计指纹前缀；期望值 = 前缀 + ':PR<PR号>:<北京时间当日日期>'，
      # 由 owner-approval-marker.sh 运行时拼接。禁止在仓库中固化字面量（固化即可跨 PR/跨日重放）。
      GOV_OWNER_APPROVAL_PREFIX: 'OWNER-APPROVED'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装工具链
        # F-20(P0-F): 覆盖率门禁需要可运行测试环境，仅装工具会导致 pytest 无法收集（缺 numpy 等运行时依赖）
        run: pip install -e ".[full,dev]" radon bandit
      - name: governance 对抗回归（F-1/F-3/F-10/F-14/F-23）
        run: |
          bash scripts/ai-verify/tests/test-anti-evasion.sh
          bash scripts/ai-verify/tests/test-mutation-skip.sh
          bash scripts/ai-verify/tests/test-owner-approval-marker.sh
      - name: 跑 risk-classify（风险定级）
        id: classify
        run: |
          # 对 PR 的改动文件定级
          FILES_FILE=changed-files.txt
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD > "$FILES_FILE"
          else
            git diff --name-only --diff-filter=ACMR HEAD~1 HEAD > "$FILES_FILE" 2>/dev/null || : > "$FILES_FILE"
          fi
          printf 'files=%s\n' "$(tr '\n' ' ' < "$FILES_FILE")" >> "$GITHUB_OUTPUT"
          if [ -s "$FILES_FILE" ]; then
            mapfile -t FILES < "$FILES_FILE"
            bash scripts/ai-verify/risk-classify.sh "${FILES[@]}" > classify.txt 2>&1 || true
          else
            bash scripts/ai-verify/risk-classify.sh > classify.txt 2>&1 || true
          fi
          cat classify.txt
          MAXL=$(grep '^MAX_LEVEL' classify.txt | tail -1 | grep -oE 'L[012]$')
          echo "max_level=${MAXL:-L2}" >> $GITHUB_OUTPUT
      - name: 跑 quality-gate（全量门禁）
        id: quality_scope
        run: |
          if grep -qE '^(src|adapters)/.*\.py$' changed-files.txt; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "hard=1" >> "$GITHUB_OUTPUT"
          else
            # 纯治理/文档改动不使用业务源码覆盖率作代理指标，由对抗套件兜底。
            echo "scope=changed" >> "$GITHUB_OUTPUT"
            echo "hard=0" >> "$GITHUB_OUTPUT"
          fi
          # F-22(P0-H): push 为合并后审计（无 PR 可审批、已合入改动无法回滚门禁），
          # 变异门禁降级为警告；PR 事件仍是严格的合入拦截点。
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "mutation_strict=0" >> "$GITHUB_OUTPUT"
          else
            echo "mutation_strict=1" >> "$GITHUB_OUTPUT"
          fi
      - name: 跑 quality-gate（按变更面执行）
        env:
          RADON_BIN: radon
          RUFF_BIN: ruff
          BANDIT_BIN: bandit
          PYTEST_BIN: pytest
          PYTEST_SCOPE: ${{ steps.quality_scope.outputs.scope }}
          COVERAGE_HARD_GATE: ${{ steps.quality_scope.outputs.hard }}
          # F-20(P0-F): 由仓库实测基线校准（pyproject fail_under=77；行78%/分支66.3% 实测于 2026-10-03）
          COV_CORE_THRESHOLD: "77"
          COV_BR_THRESHOLD: "61"
          MUTATION_STRICT: ${{ steps.quality_scope.outputs.mutation_strict }}
        run: |
          if [ -s changed-files.txt ]; then
            mapfile -t FILES < changed-files.txt
            bash scripts/ai-verify/quality-gate.sh "${{ steps.classify.outputs.max_level }}" "${FILES[@]}"
          else
            bash scripts/ai-verify/quality-gate.sh "${{ steps.classify.outputs.max_level }}"
          fi
      - name: hook 完整性校验（F-7/P1-G）
        run: bash scripts/ai-verify/hook-integrity.sh
      - name: 远端审计留痕（F-19/P2-F）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            classify.txt
            changed-files.txt
            .ai-governance/reports/
          if-no-files-found: warn
      - name: L2 双人 approve 校验
        # F-22(P0-H): push 事件没有 PR 可读 approved-reviews-count，必然 approved=0；
        # 审批是"合入前"的拦截点，只在 PR 事件执行，push 作为合并后审计留痕。
        if: steps.classify.outputs.max_level == 'L2' && github.event_name == 'pull_request'
        env:
          GOV_REVIEW_SECRET: ${{ secrets.GOV_REVIEW_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APPROVED=0
          OWNER_EXPLICIT_APPROVED=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # 读 PR 的 approved-reviews-count 与所有者显式批准指纹
            APPROVED=$(gh pr view ${{ github.event.pull_request.number }} \
              --json reviewDecision,reviews,body -q '[.reviews[] | select(.state=="APPROVED" and ((.author.typename // .author.__typename // "") != "Bot")) | .author.login] | unique | length' 2>/dev/null || echo 0)
            PR_BODY=$(gh pr view ${{ github.event.pull_request.number }} --json body -q .body 2>/dev/null || printf '')
            # F-24(治理 K): 期望指纹绑定"当前 PR 号 + 北京时间当日"，消除跨 PR/跨日重放；
            # 生成逻辑与回归测试同源（scripts/ai-verify/owner-approval-marker.sh）。
            # 注意：此处只做比较，绝不打印期望值本体（防日志泄漏导致自满足）。
            PR_NUMBER=${{ github.event.pull_request.number }}
            EXPECTED_MARKER="$(bash scripts/ai-verify/owner-approval-marker.sh "$PR_NUMBER")"
            if [ "${{ github.repository_owner }}" = "${{ github.event.pull_request.user.login }}" ] && \
               printf '%s' "$PR_BODY" | grep -Fqx "$EXPECTED_MARKER"; then
              OWNER_EXPLICIT_APPROVED=true
            fi
            echo "PR approved count: $APPROVED"
            echo "Owner explicit approval marker: $OWNER_EXPLICIT_APPROVED"
          fi
          # F-2(P0-E): review-token 不作为 CI 审批凭证；仅在单人模式下允许仓库所有者
          # 通过正文指纹完成显式授权，避免 GitHub 禁止作者自审造成的治理死锁。
          if [ "$OWNER_EXPLICIT_APPROVED" = true ]; then
            APPROVED=$((APPROVED > 1 ? APPROVED : 1))
          fi
          if [ "$APPROVED" -ge "$GOV_MIN_APPROVALS" ]; then
            echo "✅ L2: PR approve 符合单人项目授权（$APPROVED≥$GOV_MIN_APPROVALS）"
            exit 0
          fi
          echo "🛑 L2 高风险代码: 需 PR approved-reviews-count≥$GOV_MIN_APPROVALS"
          echo "   当前 approved=$APPROVED (本地签发的 AI_REVIEW_TOKEN 不被 CI 认可)"
          echo "   单人模式: 请由仓库所有者本人在 PR 正文单独一行填写当日指纹"
          echo "   格式: ${GOV_OWNER_APPROVAL_PREFIX}:PR${PR_NUMBER:-<PR号>}:<YYYY-MM-DD>（北京时间，可用 TZ=Asia/Shanghai date +%F 生成）"
          exit 1
