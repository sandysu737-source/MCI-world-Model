name: CI 4-Gate

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  # ===================== Gate 1: Ruff Lint =====================
  gate-1-lint:
    name: "Gate 1 · Ruff Lint"
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Ruff
        run: pip install "ruff>=0.6.0"

      - name: Lint (src + tests + benchmarks)
        run: |
          ruff check src/ tests/ benchmarks/

      - name: Format Check
        run: |
          ruff format --check src/ tests/ benchmarks/

  # ===================== Gate 2: mypy Strict =====================
  gate-2-types:
    name: "Gate 2 · mypy Strict"
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install (dev)
        run: pip install -e ".[dev]"

      - name: Type Check
        run: |
          mypy src/mci_world_model

  # ===================== Gate 3: pytest =====================
  gate-3-test:
    name: "Gate 3 · pytest"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install (full)
        run: pip install -e ".[full]"

      - name: Run Tests (excl. slow)
        run: |
          PYTHONPATH=${{ github.workspace }}/src pytest -m "not slow" --cov=mci_world_model --cov-report=xml --cov-report=term --cov-fail-under=45

      - name: Upload Coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # ===================== Gate 4: SIGReg Bench Smoke =====================
  gate-4-bench:
    name: "Gate 4 · SIGReg Bench Smoke"
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install (full)
        run: pip install -e ".[full]"

      - name: Import Smoke
        run: |
          python -c "
          from mci_world_model.benchmarks._noise_generator import generate_spectral_noise
          from mci_world_model.sdk import DoCalculus, MCIWorldModel
          from mci_world_model._sys import EnergyCore
          print('All import smoke tests passed.')
          "

      - name: SIGReg Module Load
        run: |
          python -c "
          import importlib
          for mod in [
              'benchmarks.sigreg.bench_sigreg_01_prepare',
              'benchmarks.sigreg.bench_sigreg_02_back_projection',
              'benchmarks.sigreg.bench_sigreg_03_lambda_sweep',
          ]:
              importlib.import_module(mod)
              print(f'  ✓ {mod}')
          "


  # ===================== Gate 5: BNLearn Benchmark =====================
  gate-5-bnlearn:
    name: "Gate 5 · BNLearn Benchmark"
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install (full)
        run: pip install -e ".[full]"

      - name: Run BNLearn Benchmark
        run: |
          PYTHONPATH=${{ github.workspace }}/src pytest benchmarks/bnlearn/ -v --tb=short --timeout=120

  # ===================== Publish: Tag & Release (main only) =====================
  release:
    name: "Publish · Tag & Release"
    runs-on: macos-latest
    needs: [gate-1-lint, gate-2-types, gate-3-test, gate-4-bench, gate-5-bnlearn]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
