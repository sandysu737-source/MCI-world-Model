name: CI 4-Gate

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ===================== Gate 1: Ruff Lint =====================
  gate-1-lint:
    name: "Gate 1 · Ruff Lint"
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Ruff
        run: pip install "ruff==0.15.17"

      - name: Lint
        run: |
          ruff check .

      - name: Format Check
        run: |
          ruff format --check .

      - name: Sensitive Term Scan
        run: |
          python scripts/ai-verify/sensitive_scan.py src README.md CHANGELOG.md docs \
            --report .ai-governance/reports/sensitive-term-scan.json

  # ===================== Gate 2: mypy Strict =====================
  gate-2-types:
    name: "Gate 2 · mypy Strict"
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install (dev)
        run: pip install -e ".[dev]"

      - name: Type Check
        run: |
          mypy src/mci_world_model

  # ===================== Gate 3: pytest =====================
  gate-3-test:
    name: "Gate 3 · pytest"
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - python-version: "3.13"
            smoke-only: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install (full+dev)
        run: pip install -e ".[full,dev]"

      - name: Run Tests (excl. slow)
        if: matrix.python-version != '3.13'
        run: |
          PYTHONPATH=${{ github.workspace }}/src pytest -m "not slow" --cov=mci_world_model --cov-report=xml --cov-report=term --cov-fail-under=77

      - name: Python 3.13 Smoke
        if: matrix.python-version == '3.13'
        run: |
          PYTHONPATH=${{ github.workspace }}/src pytest tests/adversarial -m "not slow"

      - name: AI Governance Guard
        run: |
          AI_REVIEW_CI=1 bash scripts/ai-verify/ai-guard.sh

      - name: Upload Coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # ===================== Gate 4: SIGReg Bench Smoke =====================
  gate-4-bench:
    name: "Gate 4 · SIGReg Bench Smoke"
    runs-on: macos-latest
    env:
      KMP_DUPLICATE_LIB_OK: "TRUE"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install (full+dev)
        run: pip install -e ".[full,dev]" faiss-cpu

      - name: Import Smoke
        run: |
          python -c "
          from benchmarks._noise_generator import NoiseGenerator
          from mci_world_model.sdk import DoCalculus, MCIWorldModel
          from mci_world_model._sys import EnergyCore
          print('All import smoke tests passed.')
          "

      - name: SIGReg Module Load
        run: |
          python -c "
          import importlib
          for mod in [
              'benchmarks.sigreg.bench_sigreg_01_prepare',
              'benchmarks.sigreg.bench_sigreg_02_back_projection',
              'benchmarks.sigreg.bench_sigreg_03_lambda_sweep',
          ]:
              importlib.import_module(mod)
              print(f'  ✓ {mod}')
          "


  # ===================== Gate 5: BNLearn Benchmark =====================
  gate-5-bnlearn:
    name: "Gate 5 · BNLearn Benchmark"
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install (full+dev)
        run: pip install -e ".[full,dev]"

      - name: Install Pytest Timeout
        run: pip install pytest-timeout

      - name: Run BNLearn Benchmark
        run: |
          PYTHONPATH=${{ github.workspace }}/src pytest benchmarks/bnlearn/ -v --tb=short --timeout=240

  # ===================== Publish: Tag & Release (main only) =====================
  release:
    name: "Publish · Tag & Release"
    runs-on: macos-latest
    needs: [gate-1-lint, gate-2-types, gate-3-test, gate-4-bench, gate-5-bnlearn]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
