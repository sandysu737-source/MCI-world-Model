version: "3.9"

services:
  mci:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mci-world-model
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MCI_LOG_LEVEL=INFO
      - MCI_LOG_FORMAT=json
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import mci_world_model; exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
