version: "3.9"

services:
  mci:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mci-world-model
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MCI_LOG_LEVEL=${MCI_LOG_LEVEL:-INFO}
      - MCI_LOG_FORMAT=json
      - MCI_API_KEY=${MCI_API_KEY:-}
      - MCI_RATE_LIMIT=${MCI_RATE_LIMIT:-10}
      - MCI_RATE_BURST=${MCI_RATE_BURST:-20}
      - MCI_STORAGE_BACKEND=file
      - MCI_STORAGE_PATH=/app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
